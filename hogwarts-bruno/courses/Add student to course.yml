info:
  name: Add student to course
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/courses/4/students"
  body:
    type: multipart-form
    data:
      - name: student_id
        type: text
        value: "5"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

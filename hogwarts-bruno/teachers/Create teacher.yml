info:
  name: Create teacher
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/teachers"
  body:
    type: multipart-form
    data:
      - name: name
        type: text
        value: Albus Dumbledore
      - name: house_id
        type: text
        value: "3"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

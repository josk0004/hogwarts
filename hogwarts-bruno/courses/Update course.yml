info:
  name: Update course
  type: http
  seq: 1

http:
  method: PUT
  url: "{{baseUrl}}/courses/4"
  body:
    type: multipart-form
    data:
      - name: name
        type: text
        value: Defence against the dark arts
      - name: type
        type: text
        value: core
      - name: level
        type: text
        value: OWL
      - name: school_year
        type: text
        value: "5"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

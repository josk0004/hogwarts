info:
  name: Create exam
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/exams"
  body:
    type: multipart-form
    data:
      - name: course_id
        type: text
        value: "3"
      - name: student_id
        type: text
        value: "1"
      - name: grade
        type: text
        value: A
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
